[project]
name = "jupyter-projects"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "hdbscan>=0.8.44",
    "imblearn>=0.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "nbclient>=0.10.4",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "prince>=0.19.0",
    "pyhealth>=1.1.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "statsmodels>=0.14.6",
    "umap-learn>=0.5.12",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
